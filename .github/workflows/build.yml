name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Test KlawaCore
        run: swift test --package-path Core

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Klawa.xcodeproj -scheme Klawa -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} -quiet build

      # Installers read entitlements (App Group) from the binary signature, so embed them with ldid.
      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Klawa.app
          ldid -SKeyboard/Keyboard.entitlements "$APP/PlugIns/KlawaKeyboard.appex/KlawaKeyboard"
          ldid -SApp/Klawa.entitlements "$APP/Klawa"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry Klawa.ipa Payload
          unzip -l Klawa.ipa | grep -q 'PlugIns/KlawaKeyboard.appex/KlawaKeyboard$'
          plutil -extract NSExtension.NSExtensionAttributes.RequestsOpenAccess raw "$APP/PlugIns/KlawaKeyboard.appex/Info.plist"
          ldid -e "$APP/Klawa" | grep -q group.com.exdede.klawa

      - uses: actions/upload-artifact@v4
        with:
          name: Klawa
          path: Klawa.ipa

      - name: Publish to nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Klawa (najnowszy build)" --notes "Automatyczny build z gałęzi main."
          gh release upload nightly Klawa.ipa --clobber
