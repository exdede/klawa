name: Klawa
options:
  bundleIdPrefix: com.exdede
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Klawa:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Klawa
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Klawa.entitlements
      properties:
        com.apple.security.application-groups: [group.com.exdede.klawa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exdede.klawa
    dependencies:
      - target: KlawaKeyboard
  KlawaKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Klawa
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: pl-PL
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.exdede.klawa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exdede.klawa.keyboard
